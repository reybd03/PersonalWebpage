---
layout: default
title: Blog
---

<div id="blog-inject-container">
  <h2>Blogs</h2>

  {% for post in site.posts %}
    <article>
      <h3>{{ post.title }}</h3>
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%B %d, %Y" }}</time>
      <div>
        {{ post.content }}
      </div>
    </article>
    <hr>
  {% endfor %}
</div>
