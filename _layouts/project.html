---
layout: default
---

<article class="project">
  <header>
    <h1>{{ page.title }}</h1>
    <div class="project-meta">
      <span><strong>Status:</strong> {{ page.status }}</span>
      <span><strong>Category:</strong> {{ page.category }}</span>
      <span><strong>Last updated:</strong> {{ page.lastUpdated }}</span>
      {% if page.project %}<span><strong>Project ID:</strong> {{ page.project }}</span>{% endif %}
    </div>
  </header>

  {{ content }}
</article>

<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
  mermaid.initialize({ startOnLoad: true });
  // Convert Jekyll-rendered mermaid code blocks into rendered diagrams
  document.querySelectorAll('code.language-mermaid').forEach(block => {
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = block.textContent;
    block.parentNode.replaceChild(div, block);
  });
</script>
